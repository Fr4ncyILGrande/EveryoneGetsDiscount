name: EveryoneGetsDiscount
version: ${version}
main: io.github.fr4ncyilgrande.everyonegetsdiscount.EveryoneGetsDiscount
api-version: "26.1.2"
load: POSTWORLD
description: Shares the discounts from zombie villager curing with online players
commands:
  everyonegetsdiscount:
    description: Manages EveryoneGetsDiscount settings
    usage: /<command> radius <blocks|-1>
    aliases:
      - egd
    permission: everyonegetsdiscount.admin
permissions:
  everyonegetsdiscount.admin:
    description: Allows changing EveryoneGetsDiscount settings
    default: op
