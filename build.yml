name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.1"

      - name: Build
        run: gradle build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: EveryoneGetsDiscount-2.0.1
          path: build/libs/EveryoneGetsDiscount-2.0.1.jar
          if-no-files-found: error
